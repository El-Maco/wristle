# Builds and signs the watch APK, zips the desktop listener, and attaches both
# to a GitHub Release. Runs only when started by hand: Actions > Release >
# Run workflow, choosing a tag like v0.2.0 (on a branch it only uploads build artifacts).
#
# One-time setup (repo Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64  base64 of your release.keystore
#                    PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.keystore")) | Set-Clipboard
#   KEYSTORE_PASS    the keystore password
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Android build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q aapt apksigner zipalign dalvik-exchange android-sdk-platform-23

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASS repository secrets first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build watch APK
        env:
          KEYSTORE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: watch/build.sh

      - name: Package desktop listener
        run: |
          cd desktop
          zip -r ../wristle-desktop.zip . -x '.venv/*' '__pycache__/*'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wristle
          path: |
            watch/build/wristle-*.apk
            wristle-desktop.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            watch/build/wristle-*.apk
            wristle-desktop.zip
          generate_release_notes: true
